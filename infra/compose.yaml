# Kaly — single-host stack for the Stay Cloud VPS.
#
# Layout:
#   - Supabase comes from the official self-hosted compose, vendored under
#     infra/supabase by scripts/fetch-supabase.sh and pulled in with `include`.
#     Nothing in that directory is edited, so upgrading is a re-fetch.
#   - `include` merges everything into one Compose project, which means every
#     service below shares the default network with Supabase's and can reach
#     `db`, `kong`, `auth` and friends by service name.
#   - Traefik terminates TLS for app / api / evolution. Supabase's own services
#     are routed through Traefik's file provider (infra/traefik/dynamic.yaml)
#     rather than labels, because an included service cannot be re-declared here.
#
# Usage:
#   cd infra
#   ./scripts/fetch-supabase.sh
#   node scripts/generate-secrets.mjs --domain <your-domain>
#   docker compose up -d
#
# See infra/README.md for the full runbook, including the firewall step — the
# vendored Supabase compose publishes ports on the host and they MUST NOT be
# reachable from the internet.

name: kaly

include:
  - path: supabase/docker-compose.yml
    env_file: .env

services:
  # ---------------------------------------------------------------------------
  # Edge: TLS termination and routing
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to watch container metadata, never to
      # control the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - traefik-acme:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Queue backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      # Jobs in flight must survive a restart, so persistence is on. appendfsync
      # everysec trades at most one second of acknowledged writes for throughput.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Hard ceiling so a queue backlog cannot starve Postgres of memory. BullMQ
      # data must never be evicted, hence noeviction: it fails writes instead.
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Evolution Go — WhatsApp QR channel (whatsmeow)
  # ---------------------------------------------------------------------------
  # Replaces the Baileys-based Evolution API v2 QR channel. Deliberately NOT
  # exposed through Traefik: the app reaches it over the Compose network, and the
  # only reason to open a browser at it is the one-time license activation at
  # /manager, which goes through an SSH tunnel (see infra/README.md).
  evolution-go:
    image: evoapicloud/evolution-go:latest
    restart: unless-stopped
    depends_on:
      evolution-go-db-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: kaly
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}

      POSTGRES_AUTH_DB: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/evogo_users?sslmode=disable

      # We persist messages ourselves; a second copy here would only duplicate
      # the messages table and grow without bound.
      DATABASE_SAVE_MESSAGES: "false"

      # Media bytes ride along on the webhook as base64, so the worker uploads
      # straight to Supabase Storage with no second round trip. This is what keeps
      # an audio note from delaying the agent's reply.
      WEBHOOKFILES: "true"
      MINIO_ENABLED: "false"

      # Re-attach instances after a restart, so a deploy does not silently drop
      # every paired number.
      CONNECT_ON_STARTUP: "true"

      WADEBUG: INFO
      LOGTYPE: json
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/server/ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Evolution Go wants two databases of its own, and the Supabase Postgres image
  # only runs init scripts on an empty data directory.
  evolution-go-db-init:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for name in evogo_auth evogo_users; do
          if psql -h db -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$name'" | grep -q 1; then
            echo "database '$$name' already exists"
          else
            echo "creating database '$$name'"
            psql -h db -U postgres -c "CREATE DATABASE $$name"
          fi
        done

  # ---------------------------------------------------------------------------
  # Evolution API v2 — official Meta Cloud API channel only
  # ---------------------------------------------------------------------------
  # Opt-in: `docker compose --profile business up -d`. The Baileys QR integration
  # is gone, so this exists purely for WHATSAPP-BUSINESS. There is no UI yet for
  # collecting the Meta credentials it needs, so it stays off by default rather
  # than idling ~300 MB.
  evolution-v2:
    image: atendai/evolution-api:v2.2.3
    profiles: ["business"]
    restart: unless-stopped
    depends_on:
      evolution-v2-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: https://evo-api.${DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"

      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL}

      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "false"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution-v2-instances:/evolution/instances
    expose:
      - "8080"

  evolution-v2-db-init:
    image: postgres:15-alpine
    profiles: ["business"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if psql -h db -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='evolution'" | grep -q 1; then
          echo "database 'evolution' already exists"
        else
          echo "creating database 'evolution'"
          psql -h db -U postgres -c "CREATE DATABASE evolution"
        fi

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  migrate:
    image: kaly-app:latest
    build:
      context: ..
      target: app
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_DB_SCHEMA: ${NEXT_PUBLIC_SUPABASE_DB_SCHEMA}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Runs to completion before app and worker start, so neither ever talks to a
    # schema older than the image it was built from.
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]

  app:
    image: kaly-app:latest
    build:
      context: ..
      target: app
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_DB_SCHEMA: ${NEXT_PUBLIC_SUPABASE_DB_SCHEMA}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=le
      - traefik.http.services.app.loadbalancer.server.port=3000

  worker:
    image: kaly-worker:latest
    build:
      context: ..
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      evolution-go:
        condition: service_started
    env_file: .env
    environment:
      WORKER_QUEUES: all
      ENABLE_SCHEDULER: "true"
      TZ: America/Sao_Paulo
    # Not exposed through Traefik: the health endpoint is for Docker only.
    expose:
      - "3001"

volumes:
  traefik-acme:
  redis-data:
  evolution-v2-instances:
