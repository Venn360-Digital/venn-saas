# OdontoBox360 — our services, layered onto the stack already running on the host.
#
# This is NOT infra/compose.yaml. That file stands up a whole world of its own —
# Traefik, Supabase, Redis — and must never run here: the host already has all
# three, it owns ports 80/443, and 3.9 GB cannot hold a second copy.
#
# Instead this is a lean project of its own that joins the existing
# `compose_default` network as external. Consequences worth knowing:
#
#   - `supabase-db`, `postgres` and `redis` resolve by container name.
#   - Traefik's docker provider picks up the labels below with no change to its
#     own configuration; the certificate resolver is `le`, the name it already uses.
#   - Nothing in /opt/app/compose is touched, so a StayCloud panel update to those
#     files cannot break us.
#
# Deploy, from the repository root:
#   docker compose -f infra/compose.staycloud.yaml --env-file .env up -d --build
#
# Both flags are needed and do different jobs: --env-file feeds the ${...}
# interpolation in this file, while `env_file:` on each service passes variables
# into the container — and that path is resolved relative to this file, not the
# project root, hence ../.env.

name: odontobox360

services:
  # ---------------------------------------------------------------------------
  # Schema
  # ---------------------------------------------------------------------------
  migrate:
    image: odontobox360-app:latest
    build: &app_build
      context: ../
      dockerfile: Dockerfile
      target: app
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_DB_SCHEMA: ${NEXT_PUBLIC_SUPABASE_DB_SCHEMA}
    restart: "no"
    env_file: ../.env
    # Runs to completion before app and worker start, so neither ever talks to a
    # schema older than its own image.
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    networks: [shared]

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app:
    image: odontobox360-app:latest
    build: *app_build
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ../.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.odontobox.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.odontobox.entrypoints=web,websecure
      - traefik.http.routers.odontobox.tls=true
      - traefik.http.routers.odontobox.tls.certresolver=le
      - traefik.http.services.odontobox.loadbalancer.server.port=3000
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [shared]

  worker:
    image: odontobox360-worker:latest
    build:
      context: ../
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      WORKER_QUEUES: all
      ENABLE_SCHEDULER: "true"
    logging: *logs
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [shared]

  # ---------------------------------------------------------------------------
  # WhatsApp — Evolution Go (whatsmeow)
  # ---------------------------------------------------------------------------
  # Deliberately unrouted: the app reaches it by container name, and the one-time
  # licence activation at /manager goes through an SSH tunnel. Its two databases
  # live in the `postgres` instance, not in supabase-db — WhatsApp session
  # credentials are the highest-value target on this host and have no business
  # sharing a server with the clinical data.
  evolution-go:
    image: evoapicloud/evolution-go:latest
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: odontobox360
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}
      POSTGRES_AUTH_DB: postgresql://postgres:${EVO_DB_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:${EVO_DB_PASSWORD}@postgres:5432/evogo_users?sslmode=disable

      # We persist messages ourselves; a second copy here would only duplicate
      # the messages table and grow without bound.
      DATABASE_SAVE_MESSAGES: "false"

      # Media rides along on the webhook as base64, so the worker uploads straight
      # to Supabase Storage with no second round trip. This is what keeps an audio
      # note from delaying the agent's reply.
      WEBHOOKFILES: "true"
      MINIO_ENABLED: "false"

      # Re-attach paired numbers after a restart, so a deploy does not silently
      # drop every WhatsApp session.
      CONNECT_ON_STARTUP: "true"

      WADEBUG: INFO
      LOGTYPE: json
      TZ: ${TZ:-America/Sao_Paulo}
    # Bound to loopback, not 0.0.0.0: the licence has to be activated through the
    # manager UI in a browser, and Evolution Go refuses every API call until that
    # is done (LICENSE_REQUIRED). Publishing on 127.0.0.1 makes it reachable over
    # an SSH tunnel without exposing it to the internet, and keeps the address
    # stable across recreates — a container IP would not be.
    #   ssh -N -L 8080:127.0.0.1:8080 root@<vps>   → http://localhost:8080/manager
    ports:
      - "127.0.0.1:8080:8080"
    logging: *logs
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/server/ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [shared]

  # ---------------------------------------------------------------------------
  # Evolution API v2 — o canal oficial da Meta, e só ele
  # ---------------------------------------------------------------------------
  # Ao contrário do Evolution Go, este é **roteado**: a Meta precisa alcançá-lo
  # para entregar os eventos. Isso põe a API de gestão dele na internet,
  # protegida por `AUTHENTICATION_API_KEY` e só. É o preço do canal oficial, e
  # está registrado aqui para ninguém descobrir depois.
  #
  # Banco no `postgres`, não no `supabase-db`, pela mesma razão do Go: credencial
  # de WhatsApp é o alvo mais valioso deste host e não tem o que fazer no mesmo
  # servidor que o dado clínico.
  #
  # Redis reusa o `REDIS_URL` que o app já tem, só trocando de banco lógico — o
  # BullMQ vive no 0, este no 1 — para não haver uma segunda cópia da senha.
  evolution-v2:
    # `evoapicloud`, não `atendai`: o repositório antigo não existe mais, e este é
    # o mesmo da imagem do Evolution Go que já roda aqui.
    #
    # Fixada na **v2.3.7**, e não em `latest`: conferido no Docker Hub em
    # 2026-10-16, o `latest` deles aponta para 06/05/2026 — mesma data do
    # `2.4.0-rc1`. O "mais recente" é candidato a lançamento, e isto atende a
    # clínica.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-v2-db-init:
        condition: service_completed_successfully
    environment:
      SERVER_URL: https://${EVO_V2_HOST}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${EVO_DB_PASSWORD}@postgres:5432/evolution_v2
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2

      # Guardamos mensagem no nosso banco; uma segunda cópia aqui só cresceria
      # sem fim. O mesmo raciocínio do Evolution Go.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: ${REDIS_URL}/1
      CACHE_REDIS_PREFIX_KEY: evolution_v2
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"

      # Webhook por instância, não global: cada clínica terá a sua, e o global
      # misturaria os eventos de todas numa URL só.
      WEBHOOK_GLOBAL_ENABLED: "false"

      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "false"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      TZ: ${TZ:-America/Sao_Paulo}
    labels:
      - traefik.enable=true
      - traefik.http.routers.evov2.rule=Host(`${EVO_V2_HOST}`)
      - traefik.http.routers.evov2.entrypoints=web,websecure
      - traefik.http.routers.evov2.tls=true
      - traefik.http.routers.evov2.tls.certresolver=le
      - traefik.http.services.evov2.loadbalancer.server.port=8080
    logging: *logs
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - evolution-v2-instances:/evolution/instances
    networks: [shared]

  # Cria o banco do v2 se ele ainda não existir. Molde copiado do init do
  # Evolution Go, que faz o mesmo para os dois bancos dele.
  evolution-v2-db-init:
    image: postgres:15-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${EVO_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='evolution_v2'" | grep -q 1; then
          echo "database 'evolution_v2' already exists"
        else
          echo "creating database 'evolution_v2'"
          psql -h postgres -U postgres -c "CREATE DATABASE evolution_v2"
        fi
    networks: [shared]

networks:
  shared:
    # Created by the stack in /opt/app/compose. Joining it rather than making our
    # own is what lets us resolve supabase-db, postgres and redis by name, and
    # what lets their Traefik see our labels.
    name: compose_default
    external: true

volumes:
  # As sessões do v2. Perder isto obriga cada clínica a reconectar.
  evolution-v2-instances:
