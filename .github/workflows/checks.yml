name: Verificações

# Em PR e na branch de migração. Não em `main` por push: lá o que vale é o
# `deploy.yml`, que roda as mesmas verificações antes de publicar — duplicar
# daria dois sinais para o mesmo commit.
on:
  pull_request:
  push:
    branches: [migracao/cloudflare-neon]

concurrency:
  # Um PR que recebe três pushes seguidos cancela os dois primeiros. Economiza
  # minuto de CI e evita um resultado velho chegar depois do novo.
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # O que não precisa de banco. Roda sempre, e é o que reprova mais rápido.
  # ==========================================================================
  estatico:
    name: Tipos, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # A mesma do desenvolvimento. Divergir aqui é como um defeito aparece
          # só no CI e ninguém consegue reproduzir.
          node-version: '24'
          cache: npm

      # `npm ci` e não `npm install`: o lockfile é a verdade, e `install` pode
      # resolver versão diferente da que foi revisada no PR.
      - run: npm ci

      # Antes de qualquer typecheck: o cliente do Prisma é gerado, e sem ele
      # metade dos arquivos não compila.
      - run: npx prisma generate

      - name: Tipos — aplicação
        run: npm run typecheck

      - name: Tipos — Worker da Cloudflare
        # Os Durable Objects e a configuração, contra os tipos reais da
        # Cloudflare. É a única verificação possível desse código sem publicar:
        # o `workerd` não roda na máquina de desenvolvimento (macOS 12.7.6).
        run: npm run typecheck:cloudflare

      - run: npm run lint
      - name: Auditoria de isolamento (recursos de outros apps)
        run: npm run audit:isolation

      # Os verificadores próprios do projeto. Rodados um a um — o `prebuild` já
      # os chama, mas em bloco: separados, a falha diz qual foi.
      - name: Verificadores do projeto
        run: |
          npm run lint:colors
          npm run lint:workspace
          npm run lint:fuso
          npm run check:widget

      - name: Provas que não precisam de banco
        # Os quatro do fim entraram em 2026-10-24. Eles já existiam, passavam, e
        # **não estavam em workflow nenhum** — cobertura escrita que não emitia
        # sinal. O `check:trabalhos` ficou meses reprovando sem ninguém saber:
        # a agenda do cron mudou de 13 para 14 entradas e só foi descoberto ao
        # rodar à mão. Verificador que ninguém executa é verificador que não
        # existe, com o agravante de parecer que existe.
        run: |
          npm run check:cofre
          npm run check:storage
          npm run check:tempo-real
          npm run check:envelopes
          npm run check:fuso
          npm run check:trabalhos
          npm run check:operacao
          npm run check:period
          npm run test:availability

      # O mesmo conjunto, com o relógio do runner em UTC — que é como o Worker
      # roda. É o que impede a volta do defeito: na VPS o `TZ` era
      # `America/Sao_Paulo` e mascarava toda conta de data feita em hora local.
      - name: Provas de fuso, com o relógio em UTC
        run: npm run check:fuso
        env:
          TZ: UTC

      - name: Build
        run: npm run build

      - name: Build do vinext
        # **A verificação que não existe localmente.** `vite build` instancia
        # Miniflare, e o `workerd` exige macOS 13.5+ — na máquina de
        # desenvolvimento ele falha ao carregar a configuração, antes de
        # compilar. Esta linha é o primeiro lugar onde o Worker é de fato
        # construído.
        run: npm run build:vinext

  # ==========================================================================
  # O que precisa de Postgres. Em branch própria do Neon, descartada ao fim.
  # ==========================================================================
  banco:
    name: Provas contra o Neon
    runs-on: ubuntu-latest
    # Sem o token, o job é pulado em vez de falhar: um fork não tem segredo, e
    # reprovar o PR dele por isso seria reprovar a contribuição, não o código.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    env:
      NEON_PROJECT_ID: polished-shape-42069569
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Criar branch do Neon para esta execução
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "pular=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NEON_API_KEY ausente — provas contra o banco puladas."
            exit 0
          fi

          # Branch por execução, não compartilhada. As provas criam e apagam
          # linhas, e dois PRs na mesma branch se atropelariam — `check:filas`
          # apaga chaves de idempotência por fila, o que varreria o dado do
          # outro. Copy-on-write: custo próximo de zero.
          NOME="ci-${GITHUB_RUN_ID}"
          RESP=$(curl -sS -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"${NOME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")

          ID=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["branch"]["id"])')
          # A string de conexão não é impressa: `::add-mask::` a esconde de
          # qualquer linha de log, inclusive das que um passo futuro imprimir
          # por descuido.
          URI=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["connection_uris"][0]["connection_uri"])')
          echo "::add-mask::$URI"
          echo "branch_id=$ID" >> "$GITHUB_OUTPUT"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"
          echo "pular=false" >> "$GITHUB_OUTPUT"

      - name: Migrações
        if: steps.neon.outputs.pular != 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
        run: npx prisma migrate deploy

      - name: Provas contra o banco
        if: steps.neon.outputs.pular != 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          # Segredo de assinatura descartável, gerado para esta execução. Não é
          # um valor fixo no repositório — e não precisa ser, porque nenhuma
          # sessão criada aqui sobrevive ao job.
          export BETTER_AUTH_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          npm run check:neon
          npm run check:auth
          npm run check:filas
          npm run check:tenant

      - name: Apagar a branch do Neon
        # `always()`: a branch tem de sair mesmo quando a prova falha, senão
        # cada execução vermelha deixa uma para trás.
        if: ${{ always() && steps.neon.outputs.pular != 'true' && steps.neon.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          curl -sS -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.neon.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" > /dev/null
