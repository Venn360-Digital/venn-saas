name: Preview

# Preview por PR. É o que permite experimentar o Worker de verdade antes de
# qualquer coisa chegar a `main` — e, nesta migração, é o **único** lugar onde o
# Worker roda, porque o `workerd` não roda na máquina de desenvolvimento.
on:
  pull_request:
    # `closed` entra para APAGAR o preview. Sem ele, cada PR deixava para trás
    # o Worker de preview e os Durable Objects dele — levantados em 2026-10-23:
    # 16 namespaces órfãos de PRs já fechados (`odontobox_pr-4_*` a `pr-11_*`),
    # e o número só cresce.
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Para comentar a URL no PR.
  pull-requests: write

jobs:
  preview:
    name: Publicar preview
    runs-on: ubuntu-latest

    # PR de fork **não** publica. Fork não recebe segredo por padrão, e mesmo
    # que recebesse, publicar código de terceiro com a credencial da conta é o
    # caminho clássico para comprometer uma conta de CI.
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}

    # O ambiente de preview carrega o token de escopo reduzido e a URL do banco
    # de homologação. **Nunca** os de produção — ver `deploy.yml`.
    environment:
      name: preview
      url: ${{ steps.publicar.outputs.url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Publicar
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Declarado no passo, não só no script: `vinext-cloudflare` é chamado
          # direto por npx e também lê o next.config. Com `output: standalone`
          # o vinext roda o passo standalone dele e procura a saída em `dist/`,
          # enquanto o plugin da Cloudflare escreve em `.cloudflare/output/`.
          BUILD_TARGET: cloudflare
          # Preview não aceita o campo `triggers` — e não deveria aceitar:
          # um Worker de preview com os consumidores de fila DISPUTARIA mensagem
          # real com a produção, e os treze crons rodariam contra o banco real.
          # Ver o comentário de EH_PREVIEW em `cloudflare.config.ts`.
          CF_PREVIEW: '1'
        run: |
          # `pipefail` NÃO é padrão no shell do Actions (ele roda `bash -e`), e
          # sem ele o `| tee` abaixo engolia a falha: em pipeline o status é do
          # ÚLTIMO comando, e `tee` sempre sucede. Resultado medido em
          # 2026-10-21: `cf previews deploy failed with exit code 1` por falta de
          # CLOUDFLARE_API_TOKEN, e o passo ficou ✓ e o job verde. Luz verde num
          # deploy que não aconteceu é pior do que falhar.
          set -o pipefail

          # Nome do preview pelo número do PR: estável entre pushes, então a
          # URL não muda a cada commit e o comentário não precisa ser reescrito.
          npm run build:vinext
          npx vinext-cloudflare previews deploy "pr-${{ github.event.pull_request.number }}" | tee saida.txt

          # `|| true` aqui é deliberado e não contradiz o pipefail acima: com
          # pipefail ligado, `grep | head` falha de duas formas legítimas — grep
          # sai 1 quando não casa, e leva SIGPIPE quando o `head` fecha antes.
          # Nenhuma das duas é falha de deploy. Quem decide é o passo seguinte,
          # que só comenta se a URL existir.
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' saida.txt | head -1 || true)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Comentar a URL no PR
        if: steps.publicar.outputs.url != ''
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.publicar.outputs.url }}'
            const marca = '<!-- preview-odontobox -->'
            const corpo = `${marca}\n**Preview:** ${url}\n\nBanco: branch de homologação do Neon. Não é produção.`

            // Edita o comentário anterior em vez de somar um novo: um PR com
            // dez pushes teria dez comentários idênticos.
            const { data: comentarios } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const meu = comentarios.find((c) => c.body?.includes(marca))

            if (meu) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: meu.id, body: corpo })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: corpo })
            }

  # ---------------------------------------------------------------------------
  # Apagar o preview quando o PR fecha
  # ---------------------------------------------------------------------------
  # Roda tanto em merge quanto em fechamento sem merge: o preview não serve a
  # nenhum dos dois casos depois que o PR sai de cena.
  #
  # `continue-on-error`: se o preview nunca chegou a existir — PR de fork, ou um
  # deploy que falhou antes de publicar —, `cf previews delete` reclama de algo
  # que não está lá, e reprovar o workflow por isso treinaria todo mundo a
  # ignorar o vermelho desta aba.
  limpar:
    name: Apagar o preview do PR
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Apagar
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf previews delete "pr-${{ github.event.pull_request.number }}"
