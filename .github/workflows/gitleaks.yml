name: Gitleaks

# Varredura de segredos. Em PR, confere só o diff da PR; em push/manual, o
# histórico inteiro. Falha o job se achar segredo (quebra a PR antes do merge).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varredura
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # só o diff da PR
            gitleaks detect --no-banner \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks detect --no-banner --log-opts="--all"
          fi
