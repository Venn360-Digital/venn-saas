name: Migração

# **Manual, sempre.** Alterar o schema do banco não acontece como efeito
# colateral de um merge: a reversão de uma migração é diferente da reversão de
# um deploy, e misturar as duas tira a possibilidade de reverter uma sem a
# outra.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Onde aplicar'
        required: true
        type: choice
        options: [staging, production]
        default: staging
      confirmar:
        description: 'Escreva APLICAR <ambiente> — ex.: APLICAR production'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrar:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}

    # ⚠️ O MENU DE AMBIENTE NÃO ESCOLHIA O BANCO. Agora ele é conferido.
    #
    # `secrets.DATABASE_URL_DIRECT` resolve para o segredo do AMBIENTE quando
    # ele existe, e **cai no segredo do REPOSITÓRIO quando não existe**. Em
    # 2026-10-21 os ambientes `Preview` e `Production` tinham 0 segredos, então
    # o do repositório valia nos dois casos — e ele aponta para `production`.
    # Efeito: escolher `staging` no menu aplicava migration em PRODUÇÃO, e a
    # dupla tranca (Environment + confirmação) não protegia, porque nenhuma das
    # duas olhava para qual banco era.
    #
    # O GitHub não diz de onde um segredo veio. Então a tranca nova não tenta
    # descobrir: ela confere o **destino**. Cada Environment tem de declarar a
    # variável `DB_HOST_ESPERADO` (variável, não segredo) com o host do seu
    # branch do Neon, e o passo "Conferir o destino" recusa se o host da
    # `DATABASE_URL_DIRECT` não for aquele — ou se a variável não existir.
    #
    # Por que isso basta: se o Environment não foi configurado, não há
    # `DB_HOST_ESPERADO` e o job morre antes de conectar. Se foi configurado e
    # alguém esqueceu o segredo, o host não bate e o job morre também. Nos dois
    # casos a falha é alta e o banco não é tocado.
    #
    # Para configurar: Settings → Environments → <ambiente> → Variables →
    # `DB_HOST_ESPERADO` = o host do branch (ex.: `ep-xxx-pooler.sa-east-1.aws.neon.tech`
    # sem `-pooler`, porque migração usa o endpoint direto).

    steps:
      - name: Conferir a confirmação
        # A confirmação carrega o **destino**, não só a palavra.
        #
        # Era `APLICAR` seco, e com `staging` de padrão no menu um clique
        # distraído em "Run workflow" bastava. Exigir `APLICAR production`
        # obriga quem roda a escrever para onde vai — e se o que ele escreveu
        # não for o que o menu diz, o job para.
        run: |
          ESPERADO="APLICAR ${{ inputs.ambiente }}"
          if [ "${{ inputs.confirmar }}" != "$ESPERADO" ]; then
            echo "::error::confirmação não bate. Para o ambiente \"${{ inputs.ambiente }}\" escreva exatamente: $ESPERADO"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Conferir o destino
        # A tranca que faltava: o banco que vamos tocar é o do ambiente escolhido?
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          DB_HOST_ESPERADO: ${{ vars.DB_HOST_ESPERADO }}
        run: |
          if [ -z "$DB_HOST_ESPERADO" ]; then
            echo "::error::o Environment \"${{ inputs.ambiente }}\" não declara DB_HOST_ESPERADO."
            echo "::error::Sem isso não há como provar que a DATABASE_URL_DIRECT é a dele e não a do repositório."
            echo "::error::Settings → Environments → ${{ inputs.ambiente }} → Variables → DB_HOST_ESPERADO"
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_DIRECT não está definida para este ambiente."
            exit 1
          fi

          # Só o host. O resto da URL é segredo e não é impresso.
          HOST=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[^:]+://[^@]*@##; s#[:/?].*$##')

          if [ "$HOST" != "$DB_HOST_ESPERADO" ]; then
            echo "::error::o destino não é o do ambiente \"${{ inputs.ambiente }}\"."
            echo "::error::esperado: $DB_HOST_ESPERADO"
            echo "::error::Provavelmente a DATABASE_URL_DIRECT veio do segredo do REPOSITÓRIO, não do Environment."
            exit 1
          fi
          echo "destino confirmado: $DB_HOST_ESPERADO (ambiente ${{ inputs.ambiente }})"

      - name: Mostrar o que será aplicado
        env:
          # O endpoint **direto**, não o pooled: migração precisa de conexão
          # direta.
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        # `|| true` porque `migrate status` SAI COM 1 quando há migration
        # pendente — e pendente é exatamente a situação em que este workflow é
        # chamado. Sem isto o job morre aqui e o passo "Aplicar" nunca roda:
        # medido em 2026-10-21, ao tentar criar o esquema do branch
        # `production`, que estava com 0 tabelas.
        #
        # Este passo é informativo, não é tranca. A tranca é a confirmação
        # `APLICAR` acima; e se o banco estiver inalcançável, quem falha alto é
        # o `migrate deploy` do passo seguinte.
        run: npx prisma migrate status || true

      - name: Aplicar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        # `migrate deploy` e nunca `migrate dev` nem `db push`: só aplica
        # migração já versionada, não gera nada e não altera o schema por
        # inferência.
        run: npx prisma migrate deploy
