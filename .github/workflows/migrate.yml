name: Migração

# **Manual, sempre.** Alterar o schema do banco não acontece como efeito
# colateral de um merge: a reversão de uma migração é diferente da reversão de
# um deploy, e misturar as duas tira a possibilidade de reverter uma sem a
# outra.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Onde aplicar'
        required: true
        type: choice
        options: [staging, production]
        default: staging
      confirmar:
        description: 'Escreva APLICAR para confirmar'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrar:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}

    # ⚠️ O MENU DE AMBIENTE NÃO ESCOLHE O BANCO, e o padrão dele é `staging`.
    #
    # `secrets.DATABASE_URL_DIRECT` resolve para o segredo do AMBIENTE quando
    # ele existe, e cai no segredo do REPOSITÓRIO quando não existe. Em
    # 2026-10-21 os ambientes `Preview` e `Production` têm 0 segredos, então o
    # do repositório vale nos dois casos — e ele aponta para `production`.
    #
    # Efeito: escolher `staging` no menu aplica migration em PRODUÇÃO. A dupla
    # tranca (Environment + confirmação `APLICAR`) não protege disso, porque
    # nenhuma das duas olha para qual banco é.
    #
    # O conserto é definir `DATABASE_URL_DIRECT` em cada Environment, pelo
    # painel do GitHub, apontando cada um para o branch Neon correspondente.
    # Enquanto isso não for feito, trate o menu como decoração e confira o
    # destino antes de rodar.

    steps:
      - name: Conferir a confirmação
        # Segunda tranca, além do Environment. O menu de ambiente tem `staging`
        # como padrão, e um clique distraído em "Run workflow" não deve
        # conseguir aplicar nada — nem em homologação.
        run: |
          if [ "${{ inputs.confirmar }}" != "APLICAR" ]; then
            echo "::error::confirmação ausente. Escreva APLICAR."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Mostrar o que será aplicado
        env:
          # O endpoint **direto**, não o pooled: migração precisa de conexão
          # direta.
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        # `|| true` porque `migrate status` SAI COM 1 quando há migration
        # pendente — e pendente é exatamente a situação em que este workflow é
        # chamado. Sem isto o job morre aqui e o passo "Aplicar" nunca roda:
        # medido em 2026-10-21, ao tentar criar o esquema do branch
        # `production`, que estava com 0 tabelas.
        #
        # Este passo é informativo, não é tranca. A tranca é a confirmação
        # `APLICAR` acima; e se o banco estiver inalcançável, quem falha alto é
        # o `migrate deploy` do passo seguinte.
        run: npx prisma migrate status || true

      - name: Aplicar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        # `migrate deploy` e nunca `migrate dev` nem `db push`: só aplica
        # migração já versionada, não gera nada e não altera o schema por
        # inferência.
        run: npx prisma migrate deploy
